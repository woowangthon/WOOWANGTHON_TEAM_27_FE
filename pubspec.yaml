name: liferadar
description: "LifeRadar — 내 일정을 챙기는 AI 동료 (Flutter 앱)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  android_intent_plus: ^6.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: ^14.1.2
  go_router: ^17.5.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  intl: ^0.20.2
  kakao_map_sdk: ^1.3.1
  liferadar_core:
    git:
      url: https://github.com/woowangthon/WOOWANGTHON_TEAM_27_AI.git
      ref: main
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # 수집 파이프라인(BE)이 생성한 실제 행사 스냅숏
    - assets/data/events.json
  fonts:
    # Pretendard 1.3.9 서브셋 (라틴 + KS X 1001 한글), OFL — assets/fonts/OFL.txt
    - family: LifeRadarSans
      fonts:
        - asset: assets/fonts/LifeRadarSans-Regular.otf
          weight: 400
        - asset: assets/fonts/LifeRadarSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/LifeRadarSans-Bold.otf
          weight: 700
